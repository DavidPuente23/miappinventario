{% extends 'base.html' %}
{% block content %}
<h2 class="mb-2">Registrar Servicio Técnico</h2>
<h5 class="text-primary mb-4"><i class="fas fa-tools"></i> Equipo: {{ equipo.denominacion }} (Folio: #{{ equipo_id }})</h5>

<div class="card border-top border-danger border-4">
    <div class="card-body">
        <form action="/nueva_revision/{{ equipo_id }}" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-muted fw-bold">Fecha del Servicio Realizado</label>
                    <input type="date" class="form-control" name="fecha_servicio" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-muted fw-bold">Tipo de Mantenimiento</label>
                    <select class="form-select" name="tipo_servicio">
                        <option value="Preventivo">Preventivo (Rutina / Limpieza)</option>
                        <option value="Correctivo">Correctivo (Reparación por falla)</option>
                        <option value="Inspección">Inspección / Diagnóstico</option>
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label text-muted fw-bold">Detalles / Trabajo Realizado</label>
                    <textarea class="form-control" name="detalles" rows="3" required placeholder="Ej. Se cambiaron baleros, se limpió el filtro y se lubricó el motor..."></textarea>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-muted fw-bold">Técnico o Taller Encargado</label>
                    <input type="text" class="form-control" name="tecnico_encargado" required placeholder="Nombre de quien realizó el servicio">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-danger"><i class="fas fa-calendar-alt"></i> Próxima Revisión Programada</label>
                    <input type="date" class="form-control border-danger bg-light" name="fecha_siguiente_revision" required>
                    <div class="form-text">Esta fecha reprogramará las alertas en tu Panel de Control.</div>
                </div>
            </div>
            <hr>
            <div class="d-flex justify-content-end">
                <a href="/catalogo" class="btn btn-light me-2 border">Cancelar</a>
                <button type="submit" class="btn btn-danger"><i class="fas fa-save"></i> Guardar Historial</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
